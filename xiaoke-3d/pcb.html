<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#FFF1E0;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module">
import { createStage } from './stage.js';
const { renderer, scene, camera, pcb, xk } = createStage();

window.renderStill = () => {
  pcb.setState({ traces: 1, glow: 0.3, leds: 1, knob: 1 });
  xk.root.position.set(4.4, -1, 19.2); xk.root.rotation.y = -0.2;
  xk.setPose({ eyes: 'happy', mouth: 'open', armR: 1.2, armL: 0.3 });
  camera.position.set(0, 44, 48); camera.lookAt(0, 0, 3.5);
  renderer.render(scene, camera);
};
window.renderFrame = () => window.renderStill();
window.renderStill();
window.ready = true;
</script>
